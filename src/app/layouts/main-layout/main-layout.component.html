<mat-sidenav-container
    class="h-full pattern-overlay"
    [class.no-drawer-animation]="sidePanelService.suppressAnimation()"
>
    <mat-sidenav
        #sidenav
        class="h-full auto-width"
        [mode]="isOver() ? 'over' : 'side'"
        (closed)="onSidenavClosed()"
        position="end"
        [autoFocus]="false"
    >
        @if (sidePanelService.component()) {
            <ng-container
                *ngComponentOutlet="sidePanelService.component()!; inputs: sidePanelService.componentInputs()"
            />
        }
    </mat-sidenav>

    <mat-sidenav-content #content class="bg-transparent">
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
