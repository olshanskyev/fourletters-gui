<app-split-layout [class.has-chat]="!!id" class="adaptive-layout h-full">
  <div master class="h-full">
    <app-conversations />
  </div>

  <div detail class="default-background-gradient h-full wrapper-chat">
    @if (id) {
      <app-chat [conversationId]="id" [showBackButton]="true" />
    }
  </div>
</app-split-layout>
