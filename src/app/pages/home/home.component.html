<div class="d-flex w-full h-full flex-col">
  <mat-card class="m-auto" style="width: 380px">
    <mat-card-header class="d-flex flex-col align-items-center m-b-16">
      <h1 class="app-name d-flex flex-row align-items-center gap-8">
        <img src="favicon.svg" alt="" width="32" height="32" />
        <span>{{ 'app_name' | translate }}</span>
      </h1>
      <p class="app-tagline">{{ 'app_tagline' | translate }}</p>
    </mat-card-header>

    <mat-card-content class="d-flex flex-col align-items-center gap-16">
      <div #vkButtonContainer>
      </div>
      <div #googleButtonContainer>
      </div>
    </mat-card-content>
  </mat-card>

  <footer class="login-legal-footer d-flex flex-row align-items-center justify-content-center gap-8">
    <a routerLink="/privacy">{{ 'privacy_policy' | translate }}</a>
    <span>&middot;</span>
    <a routerLink="/terms">{{ 'terms_of_service' | translate }}</a>
  </footer>
</div>
