<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>4letters Messenger</title>
    <meta
      name="description"
      content="4letters is a free, open-source messenger with end-to-end encryption. Chat one-to-one or in groups – only you and your contacts can read your messages. Installs right from your browser, no app store needed."
    />
    <link rel="canonical" href="https://4letters.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="4letters" />
    <meta property="og:title" content="4letters - Free, open-source, end-to-end encrypted messenger" />
    <meta
      property="og:description"
      content="A free, open-source messenger with end-to-end encryption. Chat one-to-one or in groups – only you and your contacts can read your messages."
    />
    <meta property="og:url" content="https://4letters.app/" />
    <meta property="og:image" content="https://4letters.app/web-app-manifest-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="4letters - Free, open-source, end-to-end encrypted messenger" />
    <meta
      name="twitter:description"
      content="A free, open-source messenger with end-to-end encryption. Chat one-to-one or in groups – only you and your contacts can read your messages."
    />
    <meta name="twitter:image" content="https://4letters.app/web-app-manifest-512x512.png" />

    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="4letters" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="default-gradient-background">
    <app-root>
      <h1>4letters</h1>
      <p>
        4letters is a free, open-source messenger with end-to-end encryption. Sign in to chat
        one-to-one or in groups; only you and the people you message can read your conversations.
      </p>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
