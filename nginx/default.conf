server {
  listen 80;
  server_name __HOST__ www.__HOST__;

  # HTTP_ONLY_START
  root /usr/share/nginx/html;
  index index.html;

  # SPA: serve the file if it exists, otherwise fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST API of the Server module (context path /server/api/v1).
  location /server/ {
    proxy_pass http://server:8080/server/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket relay of the Hub module (context path /hub/api/v1).
  location /hub/ {
    proxy_pass http://hub:8081/hub/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
  # HTTP_ONLY_END

  # HTTPS_REDIRECT_START
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
  # HTTPS_REDIRECT_END
}

# HTTPS_SERVER_START
server {
  listen 443 ssl;
  server_name __HOST__ www.__HOST__;

  ssl_certificate __CERT_PATH__fullchain.pem;
  ssl_certificate_key __CERT_PATH__privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /server/ {
    proxy_pass http://server:8080/server/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hub/ {
    proxy_pass http://hub:8081/hub/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
# HTTPS_SERVER_END
