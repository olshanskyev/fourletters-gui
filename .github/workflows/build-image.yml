name: Build GUI Image [DEV]

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'angular.json'
      - 'Dockerfile'
      - 'nginx/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GUI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fourletters-gui:dev-latest
            ghcr.io/${{ github.repository_owner }}/fourletters-gui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
